<p>product-list-component works!</p>
<table>
    <thead border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        @for (p of products; track $index ) {
            <tr>
                <td>{{p.id}}</td>
                <td>{{p.name}}</td>
                <td>{{p.price}}</td>
                <td><img [src]="p.image" [alt]="p.name" width="100" height="100"></td>
            </tr>
        }
        @empty{
            <tr>
                <td colspan="4">Not found Product!!!!</td>
            </tr>
        }
    </tbody>
</table>
