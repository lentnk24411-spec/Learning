<p>product-list-call-http-service-component works!</p>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        @for (p of products(); track $index ) {
            <tr>
                <td>{{p.id}}</td>
                <td>{{p.name}}</td>
                <td>{{p.price}}</td>
            </tr>
        } @empty {
            <tr>
                <td colspan="3">No products available.</td>
            </tr>
        }
    </tbody>
</table>
